<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엄마 아빠의 트로트 퀴즈</title>
<style>
:root{--bg:#fbf5ea;--ink:#2d2118;--wine:#8c2f39;--wine2:#b4424d;--gold:#c9a15b;--sage:#3f7d63;--navy:#2f4b73;--card:#ffffff;--soft:#f3e9d6;--mute:#7a6755}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#fff 0,var(--bg) 60%);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:26px;line-height:1.45;min-height:100vh;letter-spacing:-.01em}
.screen{display:none;max-width:620px;margin:0 auto;padding:28px 20px 48px;text-align:center}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.logo{width:104px;height:104px;margin:8px auto 0;border-radius:50%;display:grid;place-items:center;font-size:52px;background:linear-gradient(145deg,var(--wine2),var(--wine));box-shadow:0 14px 30px -10px rgba(140,47,57,.55)}
h1{font-size:40px;line-height:1.25;margin:22px 0 8px;font-weight:800;color:var(--ink);font-family:"Nanum Myeongjo","Noto Serif KR",serif}
h1::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:var(--gold);margin:16px auto 0}
.sub{font-size:24px;color:var(--mute);margin:14px 0 26px}
button{font-family:inherit;cursor:pointer;border:0;color:#fff;font-weight:700;transition:transform .12s,box-shadow .12s}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;font-size:32px;padding:26px 14px;margin:16px 0;border-radius:22px;background:linear-gradient(145deg,var(--wine2),var(--wine));box-shadow:0 14px 26px -12px rgba(140,47,57,.6)}
.big.b2{background:linear-gradient(145deg,#4a6b9b,var(--navy));box-shadow:0 14px 26px -12px rgba(47,75,115,.6)}
.big.b3{background:linear-gradient(145deg,#52977b,var(--sage));box-shadow:0 14px 26px -12px rgba(63,125,99,.6)}
.big:active,.opt:active,.tools button:active{transform:scale(.98)}
.big small{display:block;font-size:22px;font-weight:500;opacity:.9}
.top{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:700;color:var(--mute)}
.top #prog{background:var(--soft);padding:6px 16px;border-radius:999px;color:var(--ink)}
.turn{background:var(--ink);color:#fff;border-radius:999px;padding:8px 22px;display:inline-block;margin:16px 0 8px;font-size:26px;font-weight:700}
.card{background:var(--card);border-radius:28px;padding:26px 18px;margin:12px 0 16px;box-shadow:0 20px 40px -22px rgba(60,40,20,.35),0 0 0 1px rgba(201,161,91,.35)}
.singer{font-size:30px;font-weight:800;color:var(--accent);margin-top:6px}
.title{font-size:46px;font-weight:800;margin:14px 0 6px;word-break:keep-all;line-height:1.25;font-family:"Nanum Myeongjo","Noto Serif KR",serif}
.blank{display:inline-block;min-width:3em;border-bottom:5px solid var(--gold);color:transparent}
.q{font-size:22px;color:var(--mute)}
.desc{font-size:24px;line-height:1.55;color:var(--mute);margin-top:14px;word-break:keep-all;background:var(--soft);border-radius:18px;padding:14px 16px}
.desc:empty{display:none}
.opt{display:block;width:100%;font-size:36px;padding:22px 10px;margin:14px 0;border-radius:20px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 0 0 2px rgba(201,161,91,.55),0 10px 20px -14px rgba(60,40,20,.4)}
.opt:disabled{background:#efe7d9;color:#b3a591;box-shadow:none}
.opt.ok{background:var(--sage);color:#fff;box-shadow:0 14px 26px -12px rgba(63,125,99,.6)}
.tools{display:flex;gap:12px}
.tools button{flex:1;font-size:24px;padding:16px 4px;background:var(--soft);color:var(--ink);border-radius:18px}
.msg{min-height:44px;font-size:26px;font-weight:700;color:var(--accent);margin:10px 0 0}
.hint{min-height:36px;font-size:28px;color:var(--gold);font-weight:800;letter-spacing:.15em;margin-top:8px}
#pop{position:fixed;inset:0;background:rgba(45,33,24,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#pop.on{display:flex;animation:fade .25s}
.pbox{background:#fff;border-radius:32px;padding:34px 22px 26px;max-width:540px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.pbox{text-align:center}
.pbox .emo{font-size:78px}
.pbox .t{font-size:36px;font-weight:800;color:var(--accent);margin:10px 0 20px;font-family:"Nanum Myeongjo","Noto Serif KR",serif}
.score{display:flex;gap:14px;justify-content:center;margin:20px 0}
.sbox{flex:1;background:#fff;border-radius:24px;padding:18px 8px;font-size:26px;font-weight:700;color:var(--mute);box-shadow:0 0 0 2px rgba(201,161,91,.5)}
.sbox span{display:block;font-size:56px;color:var(--accent);font-weight:800}
.home{background:var(--soft);color:var(--ink);font-size:22px;padding:10px 18px;border-radius:999px}

.logo{background:repeating-radial-gradient(circle at 50% 50%,#2a1d17 0 3px,#3a2a22 3px 6px);box-shadow:0 18px 34px -12px rgba(45,33,24,.6),inset 0 0 0 4px #1f1511;position:relative}
.logo::before{content:'';position:absolute;inset:30%;border-radius:50%;background:linear-gradient(145deg,var(--wine2),var(--wine));box-shadow:0 0 0 3px var(--gold)}
.logo span{position:relative;font-size:34px;z-index:1}
.bar{height:10px;border-radius:99px;background:var(--soft);margin:16px 4px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--wine2));transition:width .4s ease}
#opts{counter-reset:o}
.opt{counter-increment:o;position:relative}
.opt::before{content:counter(o);position:absolute;left:16px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:26px;font-weight:800}
.opt.ok::before{background:rgba(255,255,255,.25);color:#fff}
.card{border-top:6px solid var(--wine);background:linear-gradient(180deg,#fffaf0,#fff 40%)}
.top .home{box-shadow:0 0 0 1px rgba(201,161,91,.5)}
.turn{background:linear-gradient(135deg,var(--wine2),var(--wine));box-shadow:0 10px 20px -10px rgba(140,47,57,.6)}

.onair{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;font-size:18px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.onair i{width:12px;height:12px;border-radius:50%;background:#e5372f;box-shadow:0 0 0 4px rgba(229,55,47,.25);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.cho{display:inline-block;letter-spacing:.18em;color:var(--accent);font-family:inherit}
.listen{display:block;width:100%;margin:12px 0 0;padding:16px;font-size:24px;border-radius:18px;background:linear-gradient(145deg,#2d2118,#4a3526);box-shadow:0 12px 22px -12px rgba(45,33,24,.7)}
.rank{display:inline-block;margin:6px 0 4px;padding:10px 26px;border-radius:999px;font-size:30px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--gold),#a97c2f);box-shadow:0 12px 22px -12px rgba(169,124,47,.8)}
.rank span{margin-right:6px}

#start.screen{max-width:none;min-height:100vh;padding:0 0 40px;position:relative;overflow:hidden;color:#fff;
 background:radial-gradient(900px 520px at 50% -8%,rgba(255,214,140,.38),transparent 60%),radial-gradient(700px 500px at 50% 105%,rgba(180,66,77,.35),transparent 60%),linear-gradient(180deg,#2e1016,#160a0d 70%)}
#start::before,#start::after{content:'';position:absolute;top:-40px;width:260px;height:700px;opacity:.16;pointer-events:none;background:linear-gradient(180deg,#ffe3a8,transparent 80%)}
#start::before{left:6%;transform:rotate(18deg);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
#start::after{right:6%;transform:rotate(-18deg);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
.lights{display:flex;justify-content:space-around;padding:16px 10px 0}
.lights i{width:14px;height:14px;border-radius:50%;background:#ffd98a;box-shadow:0 0 14px 4px rgba(255,217,138,.7);animation:tw 1.6s infinite}
.lights i:nth-child(even){animation-delay:.8s}
@keyframes tw{50%{opacity:.25;box-shadow:0 0 4px 1px rgba(255,217,138,.3)}}
.cover-in{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 22px 0;text-align:center}
.eyebrow{margin-top:10px;font-size:22px;letter-spacing:.14em;color:#ffd98a;font-weight:700}
.vinyl{width:132px;height:132px;margin:20px auto 4px;border-radius:50%;display:grid;place-items:center;position:relative;
 background:repeating-radial-gradient(circle,#0e0708 0 3px,#24161a 3px 6px);box-shadow:0 0 0 4px #c9a15b,0 24px 40px -10px rgba(0,0,0,.7);animation:spin 9s linear infinite}
.vinyl::before{content:'';position:absolute;inset:34%;border-radius:50%;background:linear-gradient(145deg,#d65a66,#8c2f39);box-shadow:0 0 0 3px #ffd98a}
.vinyl span{position:relative;z-index:1;font-size:30px;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.cover-title{margin:18px 0 6px;font-size:50px;line-height:1.2;font-weight:800;color:#ffe3a8;text-shadow:0 3px 0 #8c2f39,0 10px 30px rgba(0,0,0,.5);font-family:'Nanum Myeongjo','Noto Serif KR',serif}
.cover-title::after{display:none}
.tag{font-size:23px;line-height:1.55;color:#f1ddc0;margin-bottom:22px}
.tag b{color:#ffd98a;font-size:26px}
.pick{font-size:22px;color:#ffd98a;margin-bottom:6px;letter-spacing:.04em}
.cbtn{display:flex;align-items:center;gap:16px;width:100%;margin:14px 0;padding:20px 22px;border-radius:22px;text-align:left;color:#fff;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px rgba(255,217,138,.55),0 16px 30px -16px rgba(0,0,0,.8);backdrop-filter:blur(2px)}
.cbtn em{font-style:normal;font-size:44px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.cbtn span{font-size:32px;font-weight:800;line-height:1.25}
.cbtn small{display:block;font-size:21px;font-weight:500;color:#f1ddc0;margin-top:2px}
.cbtn.gold{background:linear-gradient(145deg,#e6bd6a,#b98a35);color:#2b1a0e;box-shadow:0 18px 32px -14px rgba(0,0,0,.8)}
.cbtn.gold em{background:rgba(255,255,255,.35)}.cbtn.gold small{color:#5a3d17}
.cbtn:active{transform:scale(.98)}

/* ===== 다크 무대 테마 (표지와 통일) ===== */
:root{--bg:#160a0d;--ink:#fbeed6;--card:#2a141a;--soft:#3b1f26;--mute:#d8c0a0;--accent:#ffd98a}
body{background:radial-gradient(900px 520px at 50% -8%,rgba(255,214,140,.22),transparent 60%),radial-gradient(700px 500px at 50% 105%,rgba(180,66,77,.28),transparent 60%),linear-gradient(180deg,#2e1016,#160a0d 70%) fixed;color:var(--ink)}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:26px;z-index:-1;opacity:.85;background:radial-gradient(circle,#ffd98a 0 4px,rgba(255,217,138,.35) 5px,transparent 9px) 0 0/44px 26px repeat-x}
h1{color:#ffe3a8;text-shadow:0 3px 0 #8c2f39,0 10px 30px rgba(0,0,0,.45)}
.sub{color:var(--mute)}
.screen{padding-top:44px}
#start.screen{padding-top:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border-top:0;box-shadow:inset 0 0 0 2px rgba(255,217,138,.5),0 22px 40px -22px rgba(0,0,0,.8)}
.title{color:#fff3da;text-shadow:0 2px 0 rgba(140,47,57,.8)}
.cho{color:var(--accent)}
.blank{border-bottom-color:var(--accent)}
.desc{background:rgba(255,255,255,.08);color:#f1ddc0}
.q{color:var(--mute)}
.top{color:var(--mute)}
.top #prog{background:rgba(255,255,255,.1);color:var(--ink)}
.top .home{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,217,138,.5)}
.bar{background:rgba(255,255,255,.12)}
.tools button{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,217,138,.4)}
.listen{background:linear-gradient(145deg,#e6bd6a,#b98a35);color:#2b1a0e}
.hint{color:var(--accent)}
.opt{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));color:#fff;box-shadow:inset 0 0 0 2px rgba(255,217,138,.55),0 14px 26px -16px rgba(0,0,0,.8)}
.opt::before{background:rgba(255,217,138,.18);color:var(--accent)}
.opt:disabled{background:rgba(255,255,255,.04);color:rgba(255,255,255,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.opt.ok{background:linear-gradient(145deg,#52977b,#3f7d63);color:#fff}
.opt.ok::before{background:rgba(255,255,255,.25);color:#fff}
#pop{background:rgba(10,4,6,.7)}
.pbox{background:linear-gradient(180deg,#3b1f26,#2a141a);box-shadow:inset 0 0 0 2px rgba(255,217,138,.6),0 30px 60px -20px rgba(0,0,0,.8)}
.pbox .t{color:#ffe3a8}
.sbox{background:rgba(255,255,255,.08);color:var(--mute);box-shadow:inset 0 0 0 2px rgba(255,217,138,.5)}
.sbox span{color:var(--accent)}
.rank{color:#2b1a0e}
.msg{color:#ff9aa5}

/* ===== 개선: 화면 압축, 자리 고정, 확인창 ===== */
.top .home{font-size:20px;padding:8px 14px}
.top{font-size:22px}
.bar{margin:12px 4px 0}
.turn{margin:12px 0 6px;font-size:22px;padding:6px 20px}
.turn::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff5a4f;margin-right:10px;animation:blink 1.2s infinite}
.card{padding:16px 14px;margin:8px 0 12px}
.q{font-size:20px}
.singer{font-size:26px;margin-top:2px}
.title{font-size:40px;margin:8px 0 2px;text-wrap:balance;word-break:keep-all}
.desc{font-size:21px;padding:10px 12px;margin-top:8px;line-height:1.4;text-wrap:balance}
.slot{min-height:34px;font-size:22px;font-weight:700;color:var(--accent);margin-top:8px;line-height:34px}
.slot.bad{color:#ff9aa5}
.tools button{font-size:21px;padding:12px 6px}
.opt{font-size:32px;padding:16px 56px;margin:10px 0;line-height:1.25}
.opt::before{width:40px;height:40px;font-size:22px}
.opt.gone{opacity:.35;text-decoration:line-through}
#quit{position:fixed;inset:0;background:rgba(10,4,6,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#quit.on{display:flex}
.ans{font-size:22px;color:var(--mute);margin:-4px 0 16px;line-height:1.5}
.ans b{display:block;font-size:30px;color:var(--accent);margin-bottom:2px}
.ans small{font-size:21px}
.pbox .listen{margin:0 0 6px}
.pbox .big{margin:12px 0 0}
.desc{margin-top:6px}
.opt{padding:14px 52px;margin:8px 0;font-size:31px}
.opt{padding:14px 14px 14px 62px;text-align:left}
.opt{text-align:center;padding:14px 14px 14px 62px}
.cho{letter-spacing:.06em}
.title:has(.cho){font-size:34px}

/* ===== 중간 개선 ===== */
body{word-break:keep-all;overflow-wrap:break-word}
.sbox small{display:block;font-size:19px;font-weight:600;margin-top:4px}
.review{margin:18px 0 6px;text-align:left}
.rvh{font-size:23px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:10px}
.rv{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;margin:8px 0;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,217,138,.35);font-size:23px}
.rv b{color:#fff3da}.rv span{color:var(--mute);font-size:20px;white-space:nowrap}
.lights{padding-top:10px}
.eyebrow{margin-top:2px;font-size:19px}
.vinyl{width:96px;height:96px;margin:10px auto 0}
.vinyl span{font-size:24px}
.cover-title{font-size:42px;margin:10px 0 4px}
.tag{font-size:20px;margin-bottom:12px}
.tag b{font-size:22px}
.pick{font-size:19px;margin-bottom:0}
.cbtn{margin:10px 0;padding:14px 18px}
.cbtn em{font-size:36px;width:54px;height:54px}
.cbtn span{font-size:28px}
.cbtn small{font-size:19px}

/* ===== 3개 버튼 + 테마 ===== */
.tools{gap:8px}
.tools button{font-size:18px;padding:12px 4px}
.themebtn{display:block;margin:6px auto 0;padding:10px 20px;border-radius:999px;font-size:19px;font-weight:700;color:#ffe3a8;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,217,138,.5)}
/* ===== 밝은 크림 테마 ===== */
body.light{--ink:#2d2118;--card:#fff;--soft:#f3e9d6;--mute:#6b5744;--accent:#8c2f39;color:#2d2118;background:radial-gradient(1200px 600px at 50% -10%,#fff 0,#fbf5ea 60%) fixed}
body.light::before{opacity:.55}
body.light h1{color:#2d2118;text-shadow:none}
body.light .sub,body.light .q,body.light .top{color:#6b5744}
body.light .card{background:#fff;box-shadow:inset 0 0 0 2px rgba(201,161,91,.6),0 18px 36px -22px rgba(60,40,20,.35)}
body.light .title{color:#2d2118;text-shadow:none}
body.light .desc{background:#f3e9d6;color:#6b5744}
body.light .top #prog,body.light .top .home{background:#f3e9d6;color:#2d2118;box-shadow:none}
body.light .bar{background:#f3e9d6}
body.light .tools button{background:#f3e9d6;color:#2d2118;box-shadow:none}
body.light .opt{background:#fff;color:#2d2118;box-shadow:inset 0 0 0 2px rgba(201,161,91,.75),0 10px 20px -14px rgba(60,40,20,.4)}
body.light .opt::before{background:#f3e9d6;color:#8c2f39}
body.light .opt:disabled{background:#efe7d9;color:#9c8c78;box-shadow:none}
body.light .opt.ok{background:#3f7d63;color:#fff}
body.light .opt.ok::before{background:rgba(255,255,255,.25);color:#fff}
body.light .slot{color:#8c2f39}
body.light .slot.bad{color:#c0392b}
body.light #pop,body.light #quit{background:rgba(45,33,24,.5)}
body.light .pbox{background:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
body.light .pbox .t{color:#8c2f39}
body.light .ans{color:#6b5744}
body.light .ans b{color:#8c2f39}
body.light .sbox{background:#fff;color:#6b5744;box-shadow:inset 0 0 0 2px rgba(201,161,91,.5)}
body.light .sbox span{color:#8c2f39}
body.light .rvh{color:#8c2f39}
body.light .rv{background:#fff;box-shadow:inset 0 0 0 1px rgba(201,161,91,.5)}
body.light .rv b{color:#2d2118}
body.light #start.screen{color:#2d2118;background:radial-gradient(900px 520px at 50% -8%,#fff,transparent 60%),linear-gradient(180deg,#fff6e0,#f6e7c8)}
body.light #start::before,body.light #start::after{opacity:.1}
body.light .cover-title{color:#8c2f39;text-shadow:0 2px 0 rgba(201,161,91,.5)}
body.light .eyebrow,body.light .pick,body.light .tag b{color:#8c2f39}
body.light .tag{color:#6b5744}
body.light .cbtn{background:#fff;color:#2d2118;box-shadow:inset 0 0 0 2px rgba(201,161,91,.75),0 14px 26px -16px rgba(60,40,20,.4)}
body.light .cbtn em{background:#f3e9d6}
body.light .cbtn small{color:#6b5744}
body.light .cbtn.gold{background:linear-gradient(145deg,#e6bd6a,#b98a35);color:#2b1a0e}
body.light .cbtn.gold small{color:#5a3d17}
body.light .themebtn{color:#8c2f39;background:#fff;box-shadow:inset 0 0 0 1px rgba(201,161,91,.7)}
.pbox .big{margin:14px 0 12px}
.pbox .listen{margin:0}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="lights"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cover-in">
    <div class="eyebrow">★ 추억의 노래 오디션 ★</div>
    <div class="vinyl"><span>🎵</span></div>
    <h1 class="cover-title">엄마 아빠의<br>트로트 퀴즈</h1>
    <div class="tag">노래 한 소절에 추억이 소르르<br><b>100곡</b> 수록 · 틀려도 괜찮아요</div>

SONGS.forEach(s=>s.desc=DESC[s.title]||'');

const NAME={mom:"엄마",dad:"아빠"};
const PRAISE={
 mom:["우리 엄마 최고!","우리 엄마 명가수!","역시 우리 엄마!","엄마 대단해요!"],
 dad:["우리 아빠 최고!","우리 아빠 명가수!","역시 우리 아빠!","아빠 대단해요!"],
 both:["두 분 호흡이 환상이에요!","역시 우리 엄마 아빠!","두 분 최고예요!","짝짝짝! 명콤비!"]};
let mode,qs,types,idx,turn,score,tried,qtype,cur;
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function goHome(){stopVoice();$('pop').classList.remove('on');$('quit').classList.remove('on');show('start')}

const CH="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung=str=>[...str].map(c=>{const n=c.charCodeAt(0)-0xAC00;return n>=0&&n<11172?CH[Math.floor(n/588)]:c}).join('');
const pickWrong=(pool,ans,n)=>shuffle(pool.filter(x=>x!==ans)).sort((a,b)=>Math.abs(a.length-ans.length)-Math.abs(b.length-ans.length)+(Math.random()-.5)*3).slice(0,n);

const JUDGE=["합격! 심사위원 전원 기립박수!","심사위원 모두 하트를 눌렀어요!","이 무대, 방송 나가도 되겠는데요?","소름 돋았어요! 완벽해요!"];
const RETRY=["아깝다! 심사위원이 한 번 더 기회를 줬어요 😊","거의 다 왔어요! 다시 골라보세요 😊","괜찮아요! 천천히 다시 골라보세요 😊"];

function askQuit(){$('quit').classList.add('on')}
function closeQuit(){$('quit').classList.remove('on')}
function applyTheme(l){document.body.classList.toggle('light',l);const b=$('themebtn');if(b)b.textContent=l?'🌙 어두운 화면으로 보기':'☀️ 밝은 화면으로 보기'}
function toggleTheme(){const l=!document.body.classList.contains('light');applyTheme(l);try{localStorage.setItem('light',l?'1':'0')}catch(e){}}
let missed=[];
function startGame(m){missed=[];
  mode=m;qs=shuffle(SONGS).slice(0,10);
  types=shuffle(['title','title','title','title','title','singer','singer','singer','singer','singer']);
  idx=0;turn=m==='dad'?'dad':'mom';score={mom:0,dad:0};
  show('quiz');render();
}
function render(){
  stopVoice();const s=qs[idx];tried=false;qtype=types[idx];
  $('barfill').style.width=((idx+1)*10)+'%';$('prog').textContent=`${idx+1} / 10 무대`;
  $('turn').textContent=mode==='both'?`${turn==='mom'?'💃 엄마':'🕺 아빠'} 차례예요!`:`${mode==='mom'?'💃 엄마':'🕺 아빠'}, 힘내세요!`;
  const titles=SONGS.map(x=>x.title),singers=[...new Set(SONGS.map(x=>x.singer))],words=[...new Set(SONGS.map(x=>x.ans))];
  $('singer').style.display='';$('desc').style.display='';
  $('singer').textContent='🎤 '+s.singer;
  $('desc').textContent=s.desc?'📜 '+s.desc:'';
  if(qtype==='blank'){
    $('qlabel').textContent='🎶 빈칸에 들어갈 말은 무엇일까요?';
    $('qtitle').innerHTML=s.title.replace(s.ans,'<span class="blank">&nbsp;</span>');
    cur={ans:s.ans,opts:[s.ans,...pickWrong(words,s.ans,2)],hint:chosung(s.ans)};
  }else if(qtype==='chosung'){
    $('qlabel').textContent='🎶 초성을 보고 노래 제목을 맞혀보세요!';
    $('qtitle').innerHTML='<span class="cho">'+chosung(s.title)+'</span>';$('desc').style.display='none';
    cur={ans:s.title,opts:[s.title,...pickWrong(titles,s.title,2)],hint:'첫 글자는 "'+s.title[0]+'"'};
  }else if(qtype==='title'){
    $('qlabel').textContent='🎶 이 가수의 노래는 무엇일까요?';
    $('singer').style.display='none';
    $('qtitle').textContent='🎤 '+s.singer;
    cur={ans:s.title,opts:[s.title,...pickWrong(titles,s.title,2)]};
  }else{
    $('qlabel').textContent='🎶 이 노래는 누구의 노래일까요?';
    $('qtitle').textContent=s.title;
    $('singer').style.display='none';$('desc').style.display='none';
    cur={ans:s.singer,opts:[s.singer,...pickWrong(singers,s.singer,2)],hint:chosung(s.singer)};
  }
  $('msg').textContent='';$('msg').className='slot';$('btnHint').disabled=false;
  $('opts').innerHTML='';
  shuffle(cur.opts).forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.dataset.v=o;
    b.textContent=(qtype==='blank'&&s.title!==s.ans)?s.title.replace(s.ans,o):o;
    {const n=b.textContent.length;b.style.fontSize=n<=7?'31px':n<=9?'27px':'24px'}
    b.onclick=()=>pick(b,o);$('opts').appendChild(b);
  });
}
function pick(btn,o){
  if(o===cur.ans){
    stopVoice();btn.classList.add('ok');dingdong();setTimeout(applause,350);
    if(!tried)score[turn]++;
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    $('pemo').textContent=rnd(['🎊','🌟','💐','🥇']);
    $('ptxt').textContent=tried?'끝까지 해내셨어요!\n두 번째 도전 성공! 👏':(mode==='both'?(turn==='mom'?'💃 엄마':'🕺 아빠')+' 정답!':rnd(PRAISE[mode]))+'\n'+rnd(JUDGE);
    $('pinfo').innerHTML='<b>'+qs[idx].title+'</b>'+qs[idx].singer+(qs[idx].desc?'<br><small>'+qs[idx].desc+'</small>':'');
    $('ptxt').style.whiteSpace='pre-line';
    $('pnext').textContent=idx===9?'결과 보기 ▶':'다음 무대 ▶';
    setTimeout(()=>$('pop').classList.add('on'),600);
  }else{
    if(!tried)missed.push({s:qs[idx],who:turn});tried=true;btn.disabled=true;boop();
    $('msg').textContent=rnd(RETRY);$('msg').className='slot bad';
  }
}
function nextQ(){
  $('pop').classList.remove('on');stopVoice();
  if(idx===9){return finish()}
  idx++;if(mode==='both')turn=turn==='mom'?'dad':'mom';render();
}
function rankOf(t){return t>=9?['👑','국민가수'] : t>=7?['🌟','인기가수'] : t>=4?['🎤','신인가수'] : ['🌱','연습생']}
function finish(){
  show('result');
  const T=mode==='both'?score.mom+score.dad:score[mode];
  const [ri,rn]=rankOf(T);
  $('rrank').innerHTML='<span>'+ri+'</span> '+(mode==='both'?'오늘의 '+rn+' 듀오':'오늘의 '+rn);
  if(mode==='both'){
    $('rtitle').textContent='두 분 호흡이 환상이에요!';
    const d=score.mom-score.dad;
    $('rmsg').textContent=(d===0?'무승부! 두 분 실력이 똑같아요 🤝':d>0?'엄마가 한 끗 앞섰어요! 아빠도 끝까지 멋졌어요 😄':'아빠가 한 끗 앞섰어요! 엄마도 끝까지 멋졌어요 😄')+(score.mom+score.dad>=9?' 두 분 다 백점!':'');
    $('rscore').innerHTML='<div class="sbox">💃 엄마<small>5문제 중</small><span>'+score.mom+'개</span></div><div class="sbox">🕺 아빠<small>5문제 중</small><span>'+score.dad+'개</span></div>';
  }else{
    $('rtitle').textContent=mode==='mom'?'우리 엄마 최고!':'우리 아빠 명가수!';
    $('rmsg').textContent='10개 무대를 모두 완주하셨어요! 정말 대단해요 👏';
    $('rscore').innerHTML='<div class="sbox">한 번에 맞힌 개수<small>10문제 중</small><span>'+T+'개</span></div>';
  }
  $('rreview').innerHTML=missed.length
    ?'<div class="rvh">🎼 다시 들어보면 좋은 노래</div>'+missed.map(m=>'<div class="rv"><b>'+m.s.title+'</b><span>'+m.s.singer+'</span></div>').join('')
    :'<div class="rvh">🎉 한 곡도 안 틀렸어요! 대단해요</div>';
  chime();setTimeout(applause,500);
}
function showHint(){
  const w=[...document.querySelectorAll('.opt')].filter(b=>b.dataset.v!==cur.ans&&!b.disabled);
  if(!w.length)return;
  const b=rnd(w);b.disabled=true;b.classList.add('gone');
  $('msg').textContent='✨ 틀린 보기 하나를 지웠어요!';$('msg').className='slot';$('btnHint').disabled=true;
}
function listen(){
  const s=qs[idx];
  window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s.singer+' '+s.title),'_blank','noopener');
}
let voiceAudio,voiceTok=0,voiceOn=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setSpeakBtn(){$('btnSpeak').textContent=voiceOn?'⏹ 멈추기':'📢 읽어주기'}
function stopVoice(){voiceTok++;voiceOn=false;if(voiceAudio){voiceAudio.pause();voiceAudio=null}if('speechSynthesis' in window)speechSynthesis.cancel();setSpeakBtn()}
function playOne(url,tok){return new Promise((res,rej)=>{if(tok!==voiceTok)return;const a=new Audio(url);voiceAudio=a;a.onended=()=>res();a.onerror=()=>rej(new Error('audio'));a.play().catch(rej)})}
function optClip(v){
  const singers=[...new Set(SONGS.map(x=>x.singer))],words=[...new Set(SONGS.map(x=>x.ans))];
  if(qtype==='blank')return 'audio/w/'+(words.indexOf(v)+1)+'.mp3';
  if(qtype==='chosung'||qtype==='title')return 'audio/t/'+(SONGS.findIndex(x=>x.title===v)+1)+'.mp3';
  return 'audio/p/'+(singers.indexOf(v)+1)+'.mp3';
}
async function speak(){
  if(voiceOn){stopVoice();return}
  stopVoice();const tok=voiceTok;voiceOn=true;setSpeakBtn();
  const s=qs[idx],n=SONGS.indexOf(s)+1;
  const seq=[qtype==='title'?'audio/b/'+n+'.mp3':qtype==='blank'?'audio/'+String(n).padStart(2,'0')+'.mp3':qtype==='chosung'?'audio/c/'+n+'.mp3':'audio/s/'+n+'.mp3'];
  [...document.querySelectorAll('.opt')].forEach((b,i)=>{if(!b.disabled)seq.push('audio/n/'+(i+1)+'.mp3',optClip(b.dataset.v))});
  try{for(const u of seq){if(tok!==voiceTok)return;await playOne(u,tok);await sleep(200)}}
  catch(e){if(tok===voiceTok)await speakTTS(s)}
  if(tok===voiceTok){voiceOn=false;setSpeakBtn()}
}
function speakTTS(s){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){$('msg').textContent='이 폰은 읽어주기를 지원하지 않아요';return res()}
    speechSynthesis.cancel();
    const ops=[...document.querySelectorAll('.opt')].filter(b=>!b.disabled).map((b,i)=>['하나','둘','셋'][i]+', '+b.dataset.v).join('. ');
    const lines=qtype==='blank'?[s.singer+' 가수님의 노래예요!','제목은, '+s.title.replace(s.ans,'음, 빈칸')+', 이랍니다!',ops]
     :qtype==='chosung'?[s.singer+' 가수님의 노래예요!','화면의 초성을 보고, 노래 제목을 맞혀보세요!',ops]
     :qtype==='title'?[s.singer+' 가수님의 노래예요!','어떤 노래인지 맞혀보세요!',ops]
     :['제목은, '+s.title+'!','이 노래는 누구의 노래일까요?',ops];
    const v=bestVoice();
    lines.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(v)u.voice=v;u.rate=.95;u.pitch=1.15;if(i===lines.length-1)u.onend=()=>res();speechSynthesis.speak(u)});
  });
}
try{applyTheme(localStorage.getItem('light')!=='0')}catch(e){applyTheme(true)}
function applause(){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const len=Math.floor(ac.sampleRate*1.6),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++){const env=Math.min(1,i/2000)*Math.max(0,1-i/len);d[i]=(Math.random()*2-1)*env*(Math.random()>.55?1:.25)}
  const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=2800;f.Q.value=.6;g.gain.value=.5;
  src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
}
// 가장 자연스러운 한국어 음성 고르기 (신경망/구글/여성 음성 우선)
function bestVoice(){
  const ko=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
  const rank=v=>{const n=v.name;let r=0;
    if(/natural|neural|online/i.test(n))r+=10;
    if(/google/i.test(n))r+=6;
    if(/sun-?hi|yuna|유나|선히|heami|혜미/i.test(n))r+=4;
    if(!v.localService)r+=1;return r};
  return ko.sort((a,b)=>rank(b)-rank(a))[0]||null;
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
// 효과음 (Web Audio)
let ac;
function tone(f,t,d,type='sine',v=.25){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  const st=ac.currentTime+t;g.gain.setValueAtTime(v,st);g.gain.exponentialRampToValueAtTime(.001,st+d);
  o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+d);
}
function dingdong(){tone(1318,0,.5);tone(1046,.25,.5);tone(1568,.5,.8)} // 딩동댕
function boop(){tone(330,0,.25,'triangle',.18);tone(262,.18,.3,'triangle',.18)}
function chime(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.15,.5))}
